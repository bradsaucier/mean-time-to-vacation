<section class="page-intro form-intro">
  <div>
    <p class="eyebrow">OPERATIONS LOGBOOK / SIGN IN</p>
    <h1>Login</h1>
    <p class="intro-copy">Sign in to add, edit, or delete trips.</p>
  </div>
</section>
<div class="row">
  <div class="col-12 col-md-8">
    <form [formGroup]="credentials" (ngSubmit)="onLoginSubmit()" novalidate>
      @if (formError()) {
        <div role="alert" class="alert alert-danger">{{ formError() }}</div>
      }
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-control" formControlName="email"
          autocomplete="username" placeholder="Enter email address" />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" formControlName="password"
          autocomplete="current-password" placeholder="Password" />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="submitting()">
        {{ submitting() ? 'Signing in...' : 'Sign In!' }}
      </button>
    </form>
  </div>
</div>
