<section class="page-intro form-intro">
  <div>
    <a routerLink="/" class="back-link">Back to manifest</a>
    <p class="eyebrow">OPERATIONS LOGBOOK / {{ code }}</p>
    <h1>Edit the departure.</h1>
    <p class="intro-copy">Refine the details. Keep the adventure on course.</p>
  </div>
</section>
@if (loading()) {
  <p class="state-panel" role="status">Loading trip details...</p>
} @else if (loadError()) {
  <div class="alert alert-danger" role="alert">
    {{ loadError() }} <a routerLink="/">Back to trips</a>
  </div>
} @else {
  <app-trip-form
    [form]="form"
    [saving]="saving()"
    [attempted]="attempted()"
    [message]="message()"
    [editing]="true"
    (submitted)="submit()"
  />
}
