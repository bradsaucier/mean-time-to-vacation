name: CI - It Worked on My Machine Is Not Evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app_admin/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Validate backend and seed data
        run: |
          node --check app.js
          node --check bin/www
          node -e "require('./app'); const { validateRecords } = require('./app_api/models/seed'); validateRecords(require('./data/trips.json')).catch(error => { console.error(error); process.exitCode = 1; });"

      - name: Install Angular dependencies
        run: npm run admin:install

      - name: Test Angular
        run: npm run admin:test

      - name: Build Angular
        run: npm run admin:build
