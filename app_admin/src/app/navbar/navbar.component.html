<header class="masthead">
  <div class="container desk-width d-flex justify-content-between align-items-center gap-3">
    <a routerLink="/" class="brand"><img src="images/logo.png" alt="Travlr Getaways" /></a>
    <nav aria-label="Main navigation" class="d-flex gap-3 align-items-center">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
        >Trip manifest</a
      ><a href="http://localhost:3000/travel" target="_blank" rel="noopener">Public site</a>
      @if (isLoggedIn()) {
        <span class="desk-label">{{ userName() }}</span>
        <button type="button" class="btn btn-link p-0" (click)="onLogout()">Log Out</button>
      } @else {
        <a routerLink="/login" routerLinkActive="active">Log In</a>
      }
    </nav>
  </div>
</header>
